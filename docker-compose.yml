services:
  user-service:
    build: .
    container_name: user-service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite+aiosqlite:///./data/user_service.db
      # Redis（验证码 / Token 服务端管控存储）；值从同目录 .env 注入
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379/0}
      # JWT 非对称加密（RS256）：密钥目录通过 ./keys 卷挂载（勿烘焙进镜像）
      - JWT_PRIVATE_KEY=keys/jwt_private.pem
      - JWT_PUBLIC_KEY=keys/jwt_public.pem
      - JWT_KEY_DIR=keys
      - JWT_ROTATION_INTERVAL_DAYS=30
      - JWT_RETIRE_DAYS=8
      - JWT_ROTATION_CHECK_HOURS=24
      - ALGORITHM=RS256
      - LOG_LEVEL=INFO
      # 超级用户（部署引导）：启动时自动创建；密码从宿主机环境变量注入，生产必须设置强密码
      - SUPERUSER_USERNAME=${SUPERUSER_USERNAME:-superuser}
      - SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD:-}
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL:-superuser@example.com}
      - SUPERUSER_FULL_NAME=${SUPERUSER_FULL_NAME:-Super User}
      - SUPERUSER_SERVICE_NAME=${SUPERUSER_SERVICE_NAME:-default}
    volumes:
      # 密钥目录挂载（含各 kid 的 PEM 与 jwt_state.json）。
      # 注意：密钥自动轮换需要在运行期写入新密钥/状态，因此必须可写挂载；
      # 私钥勿提交仓库，宿主机侧请按敏感目录管控权限。
      - ./keys:/app/keys
      # SQLite 数据库及 WAL/SHM 辅助文件持久化到宿主机 ./data 目录
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
